name: Blogs Validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  validate-blogs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate blog content
        run: npm run blogs:validate

      - name: Build website
        run: npm run build
